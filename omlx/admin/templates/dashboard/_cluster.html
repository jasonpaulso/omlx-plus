<!-- Read-only cluster panel. Hidden entirely unless /admin/api/cluster
     answers with an active role; write operations arrive in S4/S5. -->
<div x-show="mainTab === 'status'" x-cloak x-data="clusterPanel()" x-init="init()">
    <div x-show="cluster" x-cloak class="animate-fade-in-up mt-10">
        <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4 mb-6">
            <div>
                <h2 class="text-xs font-bold uppercase tracking-widest text-neutral-400 mb-2">Cluster</h2>
                <h3 class="text-2xl font-bold tracking-tight text-neutral-900">
                    Members
                    <span class="text-base font-medium text-neutral-400"
                          x-text="cluster ? `(${cluster.active_count}/${cluster.member_count} active)` : ''"></span>
                </h3>
            </div>
            <div class="flex items-center gap-2">
                <span class="px-2.5 py-1 text-xs font-medium rounded-lg bg-neutral-100 text-neutral-600"
                      x-text="cluster ? `role: ${cluster.role}` : ''"></span>
                <span class="px-2.5 py-1 text-xs font-medium rounded-lg bg-neutral-100 text-neutral-600"
                      x-show="cluster && cluster.bootstrap_token && cluster.bootstrap_token.configured">
                    join token active
                </span>
            </div>
        </div>

        <div class="bg-white rounded-2xl border border-neutral-200 overflow-hidden">
            <template x-if="cluster && cluster.members.length === 0">
                <p class="px-5 py-6 text-sm text-neutral-400">No members have joined yet.</p>
            </template>
            <template x-if="cluster && cluster.members.length > 0">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead class="bg-neutral-50 text-xs uppercase tracking-widest text-neutral-400">
                            <tr>
                                <th class="text-left font-bold px-5 py-3">Member</th>
                                <th class="text-left font-bold px-5 py-3">Endpoint</th>
                                <th class="text-left font-bold px-5 py-3">Status</th>
                                <th class="text-left font-bold px-5 py-3">Last heartbeat</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="m in cluster.members" :key="m.id">
                                <tr class="border-t border-neutral-100">
                                    <td class="px-5 py-3">
                                        <span class="font-medium text-neutral-900" x-text="m.name || m.id"></span>
                                        <span class="block text-xs font-mono text-neutral-400" x-text="m.id"></span>
                                    </td>
                                    <td class="px-5 py-3 font-mono text-xs text-neutral-600"
                                        x-text="`${m.address}:${m.port}`"></td>
                                    <td class="px-5 py-3">
                                        <span class="px-2 py-0.5 text-xs font-medium rounded-md"
                                              :class="m.status === 'active' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'"
                                              x-text="m.status"></span>
                                    </td>
                                    <td class="px-5 py-3 text-xs text-neutral-500"
                                        x-text="formatHeartbeat(m.last_heartbeat_at)"></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>
        </div>

        <template x-if="cluster && cluster.formation">
            <div class="mt-6">
                <h3 class="text-sm font-bold text-neutral-700 mb-2">
                    Distributed formation
                    <span class="text-xs font-medium text-neutral-400"
                          x-text="cluster.formation.active_model
                              ? `active: ${cluster.formation.active_model}`
                              : '(none active)'"></span>
                </h3>
                <template x-if="cluster.formation.alarms && cluster.formation.alarms.length">
                    <ul class="mb-3">
                        <template x-for="a in cluster.formation.alarms" :key="a">
                            <li class="text-xs text-red-700 font-medium" x-text="`⚠ ${a}`"></li>
                        </template>
                    </ul>
                </template>
                <div class="bg-white rounded-2xl border border-neutral-200 overflow-hidden"
                     x-show="cluster.formation.jobs && cluster.formation.jobs.length">
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm">
                            <thead class="bg-neutral-50 text-xs uppercase tracking-widest text-neutral-400">
                                <tr>
                                    <th class="text-left font-bold px-5 py-3">Job</th>
                                    <th class="text-left font-bold px-5 py-3">Kind</th>
                                    <th class="text-left font-bold px-5 py-3">Model</th>
                                    <th class="text-left font-bold px-5 py-3">Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template x-for="j in cluster.formation.jobs" :key="j.id">
                                    <tr class="border-t border-neutral-100">
                                        <td class="px-5 py-3 font-mono text-xs text-neutral-500" x-text="j.id"></td>
                                        <td class="px-5 py-3 text-neutral-600" x-text="j.kind"></td>
                                        <td class="px-5 py-3 font-mono text-xs text-neutral-600" x-text="j.model"></td>
                                        <td class="px-5 py-3">
                                            <span class="px-2 py-0.5 text-xs font-medium rounded-md"
                                                  :class="j.status === 'ready' || j.status === 'done' ? 'bg-green-100 text-green-700' : (j.status === 'failed' ? 'bg-red-100 text-red-700' : 'bg-neutral-100 text-neutral-600')"
                                                  x-text="j.status"></span>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </template>

        <!-- S4 D6: placement preview + load/unload. Thin proxies to the
             same handlers the /v1/cluster/* API calls -- POST-only
             mutations (CL-12). -->
        <div class="mt-6">
            <h3 class="text-sm font-bold text-neutral-700 mb-2">Placement</h3>
            <div class="bg-white rounded-2xl border border-neutral-200 p-4">
                <div class="flex flex-wrap items-end gap-3">
                    <div>
                        <label class="block text-xs font-medium text-neutral-500 mb-1">Model</label>
                        <select x-model="placementModel"
                                class="text-sm border border-neutral-200 rounded-lg px-2 py-1.5">
                            <option value="">Select a model…</option>
                            <template x-for="mid in modelIds" :key="mid">
                                <option :value="mid" x-text="mid"></option>
                            </template>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-neutral-500 mb-1">Prefer</label>
                        <select x-model="placementPrefer"
                                class="text-sm border border-neutral-200 rounded-lg px-2 py-1.5">
                            <option value="auto">auto</option>
                            <option value="local">local</option>
                            <option value="distributed">distributed</option>
                        </select>
                    </div>
                    <button type="button" @click="previewPlacement()"
                            :disabled="!placementModel"
                            class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-neutral-100 text-neutral-700 hover:bg-neutral-200 disabled:opacity-40">
                        Preview
                    </button>
                    <button type="button" @click="loadDistributed()"
                            :disabled="!placementModel"
                            class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-neutral-900 text-white hover:bg-neutral-700 disabled:opacity-40">
                        Load
                    </button>
                    <button type="button" @click="unloadDistributed()"
                            :disabled="!(cluster && cluster.formation && cluster.formation.active_model)"
                            class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-red-50 text-red-700 hover:bg-red-100 disabled:opacity-40">
                        Unload active
                    </button>
                </div>

                <p x-show="placementError" x-text="placementError"
                   class="mt-3 text-xs text-red-700 font-medium"></p>

                <div x-show="placementDecision" x-cloak class="mt-4 text-sm">
                    <p>
                        <span class="font-mono px-2 py-0.5 rounded-md text-xs font-semibold"
                              :class="placementDecision && placementDecision.mode === 'distributed' ? 'bg-green-100 text-green-700' : (placementDecision && placementDecision.mode === 'reject' ? 'bg-red-100 text-red-700' : 'bg-neutral-100 text-neutral-600')"
                              x-text="placementDecision ? placementDecision.mode : ''"></span>
                        <span class="text-xs text-neutral-500 ml-2"
                              x-text="placementDecision ? `world_size=${placementDecision.world_size}, per_rank_estimate=${placementDecision.per_rank_estimate}` : ''"></span>
                    </p>
                    <ul class="mt-2" x-show="placementDecision && placementDecision.reasons && placementDecision.reasons.length">
                        <template x-for="r in (placementDecision ? placementDecision.reasons : [])" :key="r">
                            <li class="text-xs text-neutral-500" x-text="`· ${r}`"></li>
                        </template>
                    </ul>
                    <div class="overflow-x-auto mt-3" x-show="placementDecision && placementDecision.fits">
                        <table class="w-full text-xs">
                            <thead class="text-neutral-400 uppercase tracking-widest">
                                <tr>
                                    <th class="text-left font-bold py-1">Node</th>
                                    <th class="text-left font-bold py-1">Ceiling</th>
                                    <th class="text-left font-bold py-1">Projected</th>
                                    <th class="text-left font-bold py-1">Fits</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template x-for="node in Object.keys(placementDecision ? placementDecision.fits : {})" :key="node">
                                    <tr class="border-t border-neutral-100">
                                        <td class="py-1 font-mono" x-text="node"></td>
                                        <td class="py-1" x-text="placementDecision.fits[node].ceiling"></td>
                                        <td class="py-1" x-text="placementDecision.fits[node].projected"></td>
                                        <td class="py-1" x-text="placementDecision.fits[node].ok ? 'yes' : 'no'"></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function clusterPanel() {
        return {
            cluster: null,
            timer: null,
            modelIds: [],
            placementModel: '',
            placementPrefer: 'auto',
            placementDecision: null,
            placementError: '',
            async init() {
                // Poll only once the endpoint has answered. With no cluster
                // role the endpoint 404s, and a standing interval would write
                // a rejected-request warning to the server log every 5s on a
                // default install.
                if (await this.refresh()) {
                    this.timer = setInterval(() => this.refresh(), 5000);
                    await this.loadModelIds();
                }
            },
            stop() {
                if (this.timer) {
                    clearInterval(this.timer);
                    this.timer = null;
                }
            },
            async refresh() {
                try {
                    const resp = await fetch('/admin/api/cluster');
                    if (!resp.ok) {
                        this.cluster = null;
                        this.stop();
                        return false;
                    }
                    this.cluster = await resp.json();
                    return true;
                } catch (e) {
                    this.cluster = null;
                    this.stop();
                    return false;
                }
            },
            async loadModelIds() {
                // The head's own discovered models (S4 D6 model picker).
                try {
                    const resp = await fetch('/admin/api/models');
                    if (!resp.ok) return;
                    const models = await resp.json();
                    this.modelIds = (models || []).map((m) => m.id).sort();
                } catch (e) {
                    // Best-effort: the picker just stays empty.
                }
            },
            async previewPlacement() {
                this.placementError = '';
                this.placementDecision = null;
                if (!this.placementModel) return;
                try {
                    const url = `/admin/api/cluster/placement?model=${encodeURIComponent(this.placementModel)}&prefer=${encodeURIComponent(this.placementPrefer)}`;
                    const resp = await fetch(url);
                    const data = await resp.json();
                    if (!resp.ok) {
                        this.placementError = data.detail || 'Preview failed';
                        return;
                    }
                    this.placementDecision = data;
                } catch (e) {
                    this.placementError = String(e);
                }
            },
            async loadDistributed() {
                this.placementError = '';
                if (!this.placementModel) return;
                try {
                    const resp = await fetch('/admin/api/cluster/models/load', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ model: this.placementModel, prefer: this.placementPrefer === 'auto' ? 'distributed' : this.placementPrefer }),
                    });
                    const data = await resp.json();
                    if (!resp.ok) {
                        this.placementError = data.detail || 'Load failed';
                        return;
                    }
                    await this.refresh();
                } catch (e) {
                    this.placementError = String(e);
                }
            },
            async unloadDistributed() {
                this.placementError = '';
                const active = this.cluster && this.cluster.formation ? this.cluster.formation.active_model : null;
                if (!active) return;
                try {
                    const resp = await fetch('/admin/api/cluster/models/unload', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ model: active }),
                    });
                    const data = await resp.json();
                    if (!resp.ok) {
                        this.placementError = data.detail || 'Unload failed';
                        return;
                    }
                    await this.refresh();
                } catch (e) {
                    this.placementError = String(e);
                }
            },
            formatHeartbeat(ts) {
                if (!ts) return 'never';
                const age = Math.max(0, Math.round(Date.now() / 1000 - ts));
                return age < 1 ? 'just now' : `${age}s ago`;
            },
        };
    }
</script>
